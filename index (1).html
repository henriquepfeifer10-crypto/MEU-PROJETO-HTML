<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para o Meu Amor 💖</title>
    <!-- Tailwind CSS para estilização rápida e bonita -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Biblioteca QRCode.js para gerar o código -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        @keyframes pulse-slow {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        .animate-pulse-slow {
            animation: pulse-slow 1.5s infinite ease-in-out;
        }
    </style>
</head>
<body class="bg-pink-50 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white rounded-3xl shadow-2xl p-8 max-w-sm w-full text-center border-4 border-pink-200">
        <!-- Ícone do Ursinho com Coração (Emoji estilizado) -->
        <div class="relative inline-block mb-4">
            <div class="text-6xl animate-pulse-slow select-none">
                
            </div>
            <div class="absolute -top-2 -right-2 text-2xl animate-bounce">
                ❤️
            </div>
        </div>

        <h1 class="text-2xl font-bold text-pink-600 mb-2"> leia aqui </h1>
        <p class="text-gray-500 text-sm mb-6">Escaneie o QR Code abaixo para ver a surpresa!</p>

        <!-- Container onde o QR Code será gerado -->
        <div class="bg-pink-50 p-4 rounded-2xl inline-block border-2 border-dashed border-pink-300 mb-6 shadow-inner">
            <div id="qrcode" class="flex justify-center"></div>
        </div>

        <div class="text-pink-500 font-medium text-lg">
              Por favor ✨
        </div>
    </div>

    <script>
        // Gera o QR Code com o texto "Te amo"
        const qrcode = new QRCode(document.getElementById("qrcode"), {
            text: "Te amo",
            width: 180,
            height: 180,
            colorDark: "#db2777", // Cor rosa escuro para combinar
            colorLight: "#fdf2f8", // Fundo combinando com o tema
            correctLevel: QRCode.CorrectLevel.H
        });
    </script>

</body>
</html>
