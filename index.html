
      <!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contagem Regressiva do Luffy</title>
    <style>
        /* Estilização Geral e Fundo */
        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden; 
        }

        /* Container Principal */
        .container {
            text-align: center;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            position: relative;
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
        }

        /* Estilo do Contador */
        #contador {
            font-size: 3em;
            font-weight: bold;
            color: #e74c3c; 
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        /* Botão de Descartar */
        .btn-descartar {
            background-color: #f1c40f; 
            color: #333;
            border: none;
            padding: 15px 30px;
            font-size: 1.2em;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 0 #c49b0c;
            transition: all 0.1s;
        }

        .btn-descartar:active {
            box-shadow: 0 2px 0 #c49b0c;
            transform: translateY(3px);
        }

        /* Imagem do Luffy carregada junto com o site */
        .luffy {
            width: 150px;
            position: absolute;
            bottom: -160px; 
            left: 50%;
            transform: translateX(-50%);
            transition: transform 0.1s ease-out; 
            z-index: -1; 
        }

        /* Classe de Animação do Pulo (ativada pelo JS) */
        .luffy.pular {
            animation: pularAnimacao 1s ease-out;
        }

        @keyframes pularAnimacao {
            0% { transform: translate(-50%, 0); }
            30% { transform: translate(-50%, -250px) rotate(-10deg); } 
            100% { transform: translate(-50%, 0); } 
        }

    </style>
</head>
<body>

    <div class="container">
        <h1>Faltam para o Feriado:</h1>
        
        <!-- Área onde os dias serão exibidos -->
        <div id="contador">-- dias</div>

        <!-- Botão para descartar o dia -->
        <button class="btn-descartar" id="btnDescartar">DESCARTAR O DIA!</button>

        <!-- Imagem do Luffy buscando do arquivo local que você fará o upload -->
        <img src="luffy.png" alt="Luffy Pulando" class="luffy" id="luffyImg">
    </div>

    <script>
        // --- CONFIGURAÇÃO ---
        // Data ajustada para 12 de Outubro de 2026. 
        // O T00:00:00 garante que a contagem seja exata para a meia-noite do dia no fuso horário correto.
        const dataFeriado = new Date('2026-10-12T00:00:00'); 
        // --------------------

        const contadorElemento = document.getElementById('contador');
        const btnDescartar = document.getElementById('btnDescartar');
        const luffyImg = document.getElementById('luffyImg');

        function calcularDiasRestantes() {
            const hoje = new Date();
            const diferencaTempo = dataFeriado - hoje;
            
            // Converte milissegundos em dias
            const diasRestantes = Math.ceil(diferencaTempo / (1000 * 60 * 60 * 24));
            
            return diasRestantes;
        }

        function atualizarContador() {
            const dias = calcularDiasRestantes();
            if (dias > 1) {
                contadorElemento.innerText = `${dias} dias`;
            } else if (dias === 1) {
                contadorElemento.innerText = `É AMANHÃ!`;
            } else if (dias === 0) {
                contadorElemento.innerText = `É HOJE! 🎉`;
            } else {
                contadorElemento.innerText = `O feriado já passou!`;
            }
        }

        // Evento de clique no botão
        btnDescartar.addEventListener('click', () => {
            // 1. Faz o Luffy pular adicionando a classe de animação
            luffyImg.classList.add('pular');

            // 2. Remove a classe após a animação terminar (1 segundo) para poder repetir
            setTimeout(() => {
                luffyImg.classList.remove('pular');
            }, 1000);

            // 3. Efeito de diminuir o dia visualmente
            let diasAtuais = calcularDiasRestantes();
            if (diasAtuais > 0) {
                contadorElemento.innerText = `${diasAtuais - 1} dias (uhu!)`;
                // Retorna ao valor real após 1.5 segundos
                setTimeout(atualizarContador, 1500);
            }
        });

        // Inicializa o contador ao carregar a página
        atualizarContador();

    </script>
</body>
</html>
